# Netlify Configuration

[build]
  command = "echo 'No build needed'"
  publish = "."

# Redirect rules
# Page redirects (specific rules first)
[[redirects]]
  from = "/store"
  to = "/pages/store.html"
  status = 200
  force = false

[[redirects]]
  from = "/about"
  to = "/pages/about.html"
  status = 200
  force = false

[[redirects]]
  from = "/contact"
  to = "/pages/contact.html"
  status = 200
  force = false

[[redirects]]
  from = "/workshops"
  to = "/pages/workshops.html"
  status = 200
  force = false

[[redirects]]
  from = "/work/painting"
  to = "/pages/work-painting.html"
  status = 200
  force = false

[[redirects]]
  from = "/work/sculpture"
  to = "/pages/work-sculpture.html"
  status = 200
  force = false

[[redirects]]
  from = "/work/graphic"
  to = "/pages/work-graphic.html"
  status = 200
  force = false

# Catch-all redirect (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Header configuration
[[headers]]
  for = "/*"
  [headers.values]
    # Cache static assets
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/index.html"
  [headers.values]
    # Don't cache HTML files heavily
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/pages/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
